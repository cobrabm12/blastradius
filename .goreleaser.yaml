version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: blastradius
    main: ./cmd/blastradius
    binary: blastradius
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "blastradius_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  footer: |
    ## Install

    ```bash
    go install github.com/cobrabm12/blastradius/cmd/blastradius@{{ .Tag }}
    ```

    Or download a binary above and put it on your PATH.
